name: Release Agent Packages

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Registry publication target after preparation"
        required: true
        type: choice
        options:
          - none
          - prepare-cli
          - verify
          - cli
          - all
          - npm
          - pypi
        default: none

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release-versions.outputs.release_version }}
      cli-release-version: ${{ steps.release-versions.outputs.cli_release_version }}
      python-release-version: ${{ steps.release-versions.outputs.python_release_version }}
      marketplace-submission-version: ${{ steps.release-versions.outputs.marketplace_submission_version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 11.7.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Release Versions
        id: release-versions
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("packages/agent-release-config.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `release_version=${release.release_version}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `cli_release_version=${release.cli_release_version}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `python_release_version=${release.python_release_version}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `marketplace_submission_version=${release.marketplace_submission_version}\n`);
          '

      - name: Verify Generated Artifacts And Release Manifest
        env:
          MAILRITH_AGENT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          pnpm generate:agent-artifacts
          pnpm generate:agent-integrations
          git diff --exit-code -- \
            packages/agent-discovery-snapshot.json \
            packages/sdk/src/generated.ts \
            packages/python-sdk/mailrith_sdk/contract.json \
            packages/python-sdk/mailrith_sdk/manifest.json \
            packages/mcp-server/src/generated-tool-manifest.ts \
            packages/agent-integrations \
            chatgpt-app-submission.json
          pnpm agent:release:verify

      - name: Test Release Surfaces
        run: |
          pnpm vitest run tests/agent-release-*.test.ts
          pnpm --filter @mailrith/public-api test
          pnpm --filter @mailrith/sdk test
          pnpm --filter @mailrith/mcp-server test
          pnpm --filter @mailrith/cli test
          pnpm --filter @mailrith/agent-skill test
          pnpm --filter @mailrith/agent-integrations test
          pnpm agent:clients:conformance -- --profile static

      - name: Test Python SDK
        working-directory: packages/python-sdk
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build Npm Packages
        run: |
          pnpm --filter @mailrith/public-api build
          pnpm --filter @mailrith/sdk build
          pnpm --filter @mailrith/mcp-server build
          pnpm --filter @mailrith/cli build

      - name: Pack Npm Artifacts
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target }}
        run: |
          mkdir -p release/npm release/platform release/python
          npm_packages=(
            @mailrith/public-api
            @mailrith/sdk
            @mailrith/mcp-server
            @mailrith/cli
            @mailrith/agent-skill
          )
          if [[ "$PUBLISH_TARGET" == "cli" || "$PUBLISH_TARGET" == "prepare-cli" ]]; then
            npm_packages=(@mailrith/cli)
          fi
          for package in "${npm_packages[@]}"; do
            pnpm --filter "$package" pack --pack-destination "$GITHUB_WORKSPACE/release/npm"
          done

      - name: Pack Python And Platform Artifacts
        if: inputs.publish_target != 'cli' && inputs.publish_target != 'prepare-cli'
        env:
          MARKETPLACE_SUBMISSION_VERSION: ${{ steps.release-versions.outputs.marketplace_submission_version }}
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0
          python -m build packages/python-sdk --outdir release/python
          tar -czf "release/platform/mailrith-openai-plugin-$MARKETPLACE_SUBMISSION_VERSION.tar.gz" \
            -C packages/agent-integrations/openai \
            mailrith
          tar -czf "release/platform/mailrith-cursor-plugin-$MARKETPLACE_SUBMISSION_VERSION.tar.gz" \
            -C packages/agent-integrations/cursor \
            .cursor-plugin \
            mailrith
          tar -czf "release/platform/mailrith-claude-connector-$MARKETPLACE_SUBMISSION_VERSION.tar.gz" \
            -C packages/agent-integrations \
            claude \
            evaluations \
            reviewer \
            PRIVACY.md \
            SUBMISSION.md \
            submitted-profile.json
          tar -czf "release/platform/mailrith-claude-copilot-plugin-$MARKETPLACE_SUBMISSION_VERSION.tar.gz" \
            -C packages/agent-integrations/claude \
            mailrith
          tar -czf "release/platform/mailrith-gemini-cli-extension-$MARKETPLACE_SUBMISSION_VERSION.tar.gz" \
            gemini-extension.json \
            GEMINI.md \
            TRADEMARKS.md \
            skills/mailrith-email-marketing
          tar -czf "release/platform/mailrith-microsoft-mcp-certification-$MARKETPLACE_SUBMISSION_VERSION.tar.gz" \
            -C packages/agent-integrations/microsoft \
            manifest.template.json \
            mcptools.json \
            intro.md \
            README.md \
            Color.png \
            Outline.png \
            TRADEMARKS.md \
            assets
          tar -czf "release/platform/mailrith-cline-submission-$MARKETPLACE_SUBMISSION_VERSION.tar.gz" \
            -C packages \
            agent-integrations/cline \
            mcp-server/llms-install.md
          cp chatgpt-app-submission.json \
            "release/platform/chatgpt-app-submission-$MARKETPLACE_SUBMISSION_VERSION.json"

      - name: Checksum Release Artifacts
        run: |
          cd release
          find npm platform python -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Require Public Repository For Publication Provenance
        if: ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')) || inputs.publish_target == 'all' || inputs.publish_target == 'npm' || inputs.publish_target == 'cli' || inputs.publish_target == 'pypi') && github.event.repository.visibility != 'public'
        run: |
          echo "Package publication is blocked while this user-owned repository is private."
          echo "Make the repository public before publishing so npm and GitHub provenance can be generated and verified."
          exit 1

      - name: Attest Package Provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release/**/*"

      - name: Record Private Repository Attestation Gate
        if: github.event.repository.visibility != 'public'
        run: |
          echo "::notice title=Package provenance gate::GitHub artifact attestations are unavailable for this user-owned private repository. Package preparation can continue, but publication remains blocked until the repository is public."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mailrith-agent-packages
          path: release
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    needs: prepare
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')) || inputs.publish_target == 'all' || inputs.publish_target == 'npm' || inputs.publish_target == 'cli'
    runs-on: ubuntu-latest
    environment: agent-packages-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mailrith-agent-packages
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify Checksums
        run: sha256sum --check SHA256SUMS
        working-directory: release
      - name: Publish Npm Packages In Dependency Order
        env:
          NPM_CONFIG_PROVENANCE: "true"
          PUBLISH_TARGET: ${{ inputs.publish_target }}
        run: |
          archives=(
            ./npm/mailrith-public-api-*.tgz
            ./npm/mailrith-sdk-*.tgz
            ./npm/mailrith-mcp-server-*.tgz
            ./npm/mailrith-cli-*.tgz
            ./npm/mailrith-agent-skill-*.tgz
          )
          if [[ "$PUBLISH_TARGET" == "cli" ]]; then
            archives=(./npm/mailrith-cli-*.tgz)
          fi
          for archive in "${archives[@]}"; do
            npm publish "$archive" --access public --provenance --tag latest
          done
        working-directory: release

  publish-python:
    needs: prepare
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')) || inputs.publish_target == 'all' || inputs.publish_target == 'pypi'
    runs-on: ubuntu-latest
    environment: agent-packages-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mailrith-agent-packages
          path: release
      - name: Verify Checksums
        run: sha256sum --check SHA256SUMS
        working-directory: release
      - name: Publish Python Package With Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/python
          print-hash: true

  clean-install:
    needs:
      - prepare
      - publish-npm
      - publish-python
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')) || (inputs.publish_target != 'none' && inputs.publish_target != 'prepare-cli')) &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Clean Install From Public Registries
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release-version }}
          CLI_RELEASE_VERSION: ${{ needs.prepare.outputs.cli-release-version }}
          PYTHON_RELEASE_VERSION: ${{ needs.prepare.outputs.python-release-version }}
        run: |
          npm_packages=(
            "@mailrith/public-api@$RELEASE_VERSION"
            "@mailrith/sdk@$RELEASE_VERSION"
            "@mailrith/mcp-server@$RELEASE_VERSION"
            "@mailrith/cli@$CLI_RELEASE_VERSION"
            "@mailrith/agent-skill@$RELEASE_VERSION"
          )
          for attempt in {1..30}; do
            missing_packages=()
            for package_spec in "${npm_packages[@]}"; do
              if ! npm view "$package_spec" version >/dev/null 2>&1; then
                missing_packages+=("$package_spec")
              fi
            done

            if (( ${#missing_packages[@]} == 0 )); then
              break
            fi

            if (( attempt == 30 )); then
              echo "::error::npm registry propagation timed out for: ${missing_packages[*]}"
              exit 1
            fi

            echo "Waiting for npm registry propagation (${missing_packages[*]}); attempt $attempt/30"
            sleep 10
          done

          npm_directory="$(mktemp -d)"
          cd "$npm_directory"
          npm init --yes
          npm install "${npm_packages[@]}"
          # Dependency review blocks high-severity additions. Keep the public
          # clean-install gate aligned with that policy while upstream fixes
          # for transitive moderate advisories are unavailable.
          npm audit --audit-level=high
          node --input-type=module -e 'import("@mailrith/sdk").then((sdk) => { if (!sdk.createMailrithClient) process.exit(1) })'
          test "$(npx mailrith version)" = "$CLI_RELEASE_VERSION"
          npx mailrith-agent-skill install --dry-run --target "$npm_directory/skill"

          python_directory="$(mktemp -d)"
          python -m venv "$python_directory/venv"
          "$python_directory/venv/bin/pip" install "mailrith-sdk==$PYTHON_RELEASE_VERSION"
          "$python_directory/venv/bin/python" -c 'from mailrith_sdk import MailrithClient; assert MailrithClient'
