[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mailrith-sdk"
version = "0.1.0"
description = "Official Python SDK for Mailrith's public API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Mailrith" }
]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]

[project.urls]
Documentation = "https://mailrith.com/developers/sdks"
Homepage = "https://mailrith.com"
Issues = "https://github.com/anrawool/mailrith-agent-platform/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mailrith_sdk*"]

[tool.setuptools.package-data]
mailrith_sdk = ["contract.json", "manifest.json", "py.typed"]
