[mcp_servers.mailrith]
url = "https://api.mailrith.com/mcp"
auth = "oauth"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = [
  "discovery_get_capabilities",
  "workspace_get",
  "sender_identities_list",
  "sender_identities_get",
  "analytics_create_report",
  "analytics_get_report",
  "subscribers_list",
  "subscribers_get",
  "subscribers_upsert",
  "subscribers_update",
  "subscribers_update_status",
  "subscribers_add_tag",
  "subscribers_remove_tag",
  "subscribers_add_to_sequence",
  "subscribers_remove_from_sequence",
  "tags_list",
  "tags_get",
  "tags_create",
  "custom_fields_list",
  "custom_fields_get",
  "segments_list",
  "segments_get",
  "segments_preview",
  "broadcasts_list",
  "broadcasts_create",
  "broadcasts_get",
  "broadcasts_update",
  "broadcasts_preflight",
  "broadcasts_send_test",
  "broadcasts_schedule",
  "broadcasts_unschedule",
  "broadcasts_send",
  "broadcasts_cancel",
  "broadcasts_get_send_progress",
  "sequences_list",
  "sequences_create",
  "sequences_get",
  "sequences_update",
  "sequences_preflight",
  "sequences_preview_journey",
  "sequences_send_test",
  "sequences_update_status",
  "automations_list",
  "automations_create",
  "automations_get",
  "automations_update",
  "automations_preflight",
  "automations_preview_journey",
  "automations_send_test",
  "automations_update_status",
  "email_templates_list",
  "email_templates_create",
  "email_templates_get",
  "email_templates_preview",
  "email_templates_update",
]

# Run `codex mcp login mailrith` after adding this block.
# For a non-interactive runtime, replace `auth = "oauth"` with:
# bearer_token_env_var = "MAILRITH_ACCESS_TOKEN"
