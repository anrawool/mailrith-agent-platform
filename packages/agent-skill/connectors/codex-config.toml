[mcp_servers.mailrith]
url = "https://api.mailrith.com/mcp"
auth = "oauth"
enabled = true
required = false
default_tools_approval_mode = "never"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = [
  "mailrith_check_connection",
  "mailrith_search_operations",
  "mailrith_get_operation",
  "mailrith_read",
  "mailrith_write",
  "mailrith_delete",
  "mailrith_live",
]

# Run `codex mcp login mailrith` after adding this block.
# For a non-interactive runtime, replace `auth = "oauth"` with:
# bearer_token_env_var = "MAILRITH_ACCESS_TOKEN"
